{% set version = "4.7.0" %}
{% set python_min = "3.10.0" %}

package:
  name: pywps
  version: {{ version }}

source:
  url: https://github.com/geopython/pywps/archive/{{ version }}.tar.gz
  sha256: 8aeb4fb8f892550ea2c636a80545f921446d784b128d1f5b00b18bac1d3369a3

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=80.0
  run:
    - python >={{ python_min }}
    - humanize >=4.5.0
    - jinja2 >=3.1.0
    - jsonschema >=4.20.0
    - lxml >=6.0.2
    - markupsafe >=3.0.3
    - numpy >=1.22.2
    - owslib >=0.35.0
    - python-dateutil
    - requests >=2.32.5
    - sqlalchemy >=2.0.44
    - urllib3 >=2.5.0
    - werkzeug >=3.1.4
  run_constrained:
    - boto3
    - drmaa
    - fiona
    - python-geotiff
    - netcdf4
    - tifffile <=2025.5.10
    - zarr <3.0

test:
  imports:
    - pywps
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check

about:
  home: http://pywps.org/
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: PyWPS (Python Web Processing Service) is an implementation of the Web processing Service standard from Open Geospatial Consortium.
  doc_url: https://pywps.org/
  dev_url: https://github.com/geopython/PyWPS

extra:
  recipe-maintainers:
    - Zeitsperre
    - huard
    - cehbrecht
